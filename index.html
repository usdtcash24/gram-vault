<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GRAM: THE GENESIS VAULT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #060b11;
            --accent-cyan: #38bdf8;
            --accent-blue: #0284c7;
            --text-dim: #64748b;
        }
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 24px 16px;
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            overflow: hidden;
        }
        .header {
            text-align: center;
            margin-top: 10px;
        }
        .title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #ffffff;
        }
        .subtitle {
            font-size: 13px;
            letter-spacing: 2px;
            color: var(--accent-cyan);
            margin-top: 4px;
        }
        .crystal-container {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .crystal-svg {
            width: 170px;
            height: 170px;
            filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.45));
            transition: transform 0.08s ease;
        }
        .crystal-svg:active {
            transform: scale(0.94);
        }
        .counter-section {
            text-align: center;
            margin-bottom: 10px;
        }
        .shards-amount {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-shadow: 0 0 16px rgba(56, 189, 248, 0.3);
        }
        .shards-label {
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 2px;
            margin-top: 4px;
        }
        .progress-container {
            width: 100%;
            max-width: 340px;
            margin-bottom: 25px;
        }
        .progress-btn {
            width: 100%;
            background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
            border: 1px solid rgba(56, 189, 248, 0.5);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(2, 132, 199, 0.3);
        }
        .stats-bar {
            width: 100%;
            max-width: 340px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-dim);
            font-family: monospace;
            padding: 0 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">GRAM:</div>
        <div class="subtitle">THE GENESIS VAULT</div>
    </div>

    <div class="crystal-container" id="crystalBtn">
        <svg class="crystal-svg" viewBox="0 0 100 140" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="50,5 90,40 90,100 50,135 10,100 10,40" stroke="#38bdf8" stroke-width="2.5" fill="rgba(56, 189, 248, 0.05)"/>
            <polygon points="50,5 65,40 65,100 50,135 35,100 35,40" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 1"/>
            <line x1="10" y1="40" x2="90" y2="40" stroke="#38bdf8" stroke-width="1.5"/>
            <line x1="10" y1="100" x2="90" y2="100" stroke="#38bdf8" stroke-width="1.5"/>
            <line x1="50" y1="5" x2="50" y2="135" stroke="#38bdf8" stroke-width="2"/>
        </svg>
    </div>

    <div class="counter-section">
        <div class="shards-amount" id="shardCounter">1,482,900</div>
        <div class="shards-label">GRAM SHARDS</div>
    </div>

    <div class="progress-container">
        <div class="progress-btn">DECRYPTION: 68%</div>
    </div>

    <div class="stats-bar">
        <span>NODE: ONLINE</span>
        <span id="energyCounter">ENERGY: 2000 / 2000</span>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let shards = 1482900;
        let energy = 2000;
        const shardEl = document.getElementById('shardCounter');
        const energyEl = document.getElementById('energyCounter');
        const crystal = document.getElementById('crystalBtn');

        crystal.addEventListener('pointerdown', (e) => {
            if (energy <= 0) return;
            shards += 1;
            energy -= 1;
            
            shardEl.innerText = shards.toLocaleString();
            energyEl.innerText = `ENERGY: ${energy} / 2000`;

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });
    </script>
</body>
</html>
